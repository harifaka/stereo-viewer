services:
  stereo_app:
    build: .
    ports:
      - "5000:5000"
    privileged: true
    environment:
      CAMERA_SETTINGS_PATH: /app/config/cameras.json
      TAPNET_CHECKPOINT: /app/models/tapir_checkpoint.pt
      OPENCV_VIDEOIO_PRIORITY_OBSENSOR: 0
    volumes:
      - "./camera-config:/app/config"
      # Place a TAPIR / BootsTAPIR PyTorch checkpoint here as tapir_checkpoint.pt.
      - "./models:/app/models"