<dialog class="camera-settings-dialog" id="cameraSettingsDialog" aria-labelledby="cameraSettingsTitle">
    <form class="camera-settings-form" id="cameraSettingsForm">
        <div class="camera-settings-heading">
            <div>
                <div class="camera-settings-kicker" data-camera-settings-copy="kicker">Camera setup</div>
                <h2 id="cameraSettingsTitle" data-camera-settings-copy="title">Camera source and mapping</h2>
                <p data-camera-settings-copy="intro">Choose a capture source for this browser. Camera labels, indexes, and Active settings are shared by the server.</p>
            </div>
            <button class="camera-settings-close" type="button" data-camera-settings-close data-camera-settings-aria="close" aria-label="Close camera settings">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
            </button>
        </div>
        <div class="camera-settings-body">
            <div class="camera-settings-source-row">
                <label class="camera-settings-source-label" for="cameraCaptureSource" data-camera-settings-copy="source">Capture source</label>
                <select class="camera-settings-source" id="cameraCaptureSource">
                    <option value="browser" data-camera-settings-copy="browserSource">Browser cameras</option>
                    <option value="docker" data-camera-settings-copy="dockerSource">Docker / Linux devices</option>
                </select>
            </div>
            <section aria-live="polite">
                <h3 data-camera-settings-copy="availableTitle">Detected Docker / Linux cameras</h3>
                <ul id="availableCameraDevices"></ul>
            </section>
            <div class="camera-settings-table-wrap">
                <table class="camera-settings-table">
                    <thead>
                        <tr>
                            <th scope="col" data-camera-settings-copy="slot">Slot</th>
                            <th scope="col" data-camera-settings-copy="device">Camera index</th>
                            <th scope="col" data-camera-settings-copy="label">Custom label / role</th>
                            <th scope="col" data-camera-settings-copy="active">Active</th>
                            <th scope="col"><span class="sr-only" data-camera-settings-copy="remove">Remove</span></th>
                        </tr>
                    </thead>
                    <tbody id="cameraSettingsRows"></tbody>
                </table>
            </div>
            <div class="camera-settings-toolbar">
                <button class="camera-settings-add" type="button" id="rescanCameraDevices">
                    <span data-camera-settings-copy="rescanCameras">Rescan and assign cameras</span>
                </button>
                <button class="camera-settings-add" type="button" id="addCameraSlot">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
                    <span data-camera-settings-copy="addCamera">Add camera</span>
                </button>
            </div>
        </div>
        <div class="camera-settings-footer">
            <p class="camera-settings-message" id="cameraSettingsMessage" role="status" aria-live="polite"></p>
            <div class="camera-settings-actions">
                <button class="camera-settings-secondary" type="button" data-camera-settings-close data-camera-settings-copy="cancel">Cancel</button>
                <button class="camera-settings-primary" id="saveCameraSettings" type="submit" data-camera-settings-copy="save">Save settings</button>
            </div>
        </div>
    </form>
</dialog>
<script>
    (() => {
        const translations = {
            en: {
                kicker: 'Camera setup', title: 'Camera source and mapping',
                intro: 'Choose the source for the Multi-Camera Monitor in this browser. Camera labels, indexes, and Active settings are shared by the server.',
                source: 'Capture source', browserSource: 'Browser cameras', dockerSource: 'Docker / Linux devices',
                availableTitle: 'Detected Docker / Linux cameras',
                noAvailableDevices: 'No functional /dev/video devices detected.',
                availableDevicesError: 'Could not list available devices.',
                slot: 'Slot', device: 'Camera index', label: 'Custom label / role', active: 'Active', remove: 'Remove',
                addCamera: 'Add camera', removeCamera: 'Remove camera {slot}',
                cancel: 'Cancel', save: 'Save settings', close: 'Close camera settings',
                camera: 'Camera {slot}', browserOption: 'Browser camera {index}', dockerOption: '/dev/video{index} (index {index})',
                duplicateBrowserIndexes: 'Choose a different camera index for each slot.',
                maxCameras: 'Sixteen cameras is the maximum.',
                noIndex: 'No unused camera index remains.',
                rescanCameras: 'Rescan and assign cameras',
                rescanned: 'Cameras rescanned and assigned to slots 1–3.',
                noCameraAssignment: 'No working cameras were found; your current assignments were kept.',
                rescanError: 'Could not rescan cameras: {message}',
                loaded: 'Camera settings loaded.', saved: 'Camera settings saved.',
                loadError: 'Could not load camera settings: {message}',
                saveError: 'Could not save camera settings: {message}'
            },
            hu: {
                kicker: 'Kamerabeállítás', title: 'Kameraforrás és kiosztás',
                intro: 'Válaszd ki a Többkamerás monitor forrását ebben a böngészőben. A címkék, indexek és Aktív beállítások a szerver felhasználói között közösek.',
                source: 'Rögzítési forrás', browserSource: 'Böngésző kamerái', dockerSource: 'Docker / Linux eszközök',
                availableTitle: 'Észlelt Docker / Linux kamerák',
                noAvailableDevices: 'Nem található működő /dev/video eszköz.',
                availableDevicesError: 'Az elérhető eszközök listája nem tölthető be.',
                slot: 'Hely', device: 'Kameraindex', label: 'Egyéni címke / szerep', active: 'Aktív', remove: 'Eltávolítás',
                addCamera: 'Kamera hozzáadása', removeCamera: 'A(z) {slot}. kamera eltávolítása',
                cancel: 'Mégse', save: 'Beállítások mentése', close: 'Kamerabeállítások bezárása',
                camera: '{slot}. kamera', browserOption: 'Böngésző kamera {index}', dockerOption: '/dev/video{index} (index {index})',
                duplicateBrowserIndexes: 'Minden kamerához külön indexet válassz.',
                maxCameras: 'Legfeljebb tizenhat kamera adható meg.',
                noIndex: 'Nincs több szabad kameraindex.',
                rescanCameras: 'Kamerák újrakeresése és kiosztása',
                rescanned: 'A kamerák újrakeresése és kiosztása az 1–3. helyre megtörtént.',
                noCameraAssignment: 'Nem található működő kamera; a jelenlegi kiosztás megmaradt.',
                rescanError: 'A kamerák újrakeresése nem sikerült: {message}',
                loaded: 'Kamerabeállítások betöltve.', saved: 'Kamerabeállítások mentve.',
                loadError: 'A kamerabeállítások nem tölthetők be: {message}',
                saveError: 'A kamerabeállítások nem menthetők: {message}'
            }
        };
        const language = localStorage.getItem('stereoLabLanguage') === 'hu' ? 'hu' : 'en';
        const text = (key, values = {}) => Object.entries(values).reduce(
            (result, [name, value]) => result.replaceAll(`{${name}}`, value),
            translations[language][key] || key
        );
        const dialog = document.getElementById('cameraSettingsDialog');
        if (!dialog) return;
        const form = document.getElementById('cameraSettingsForm');
        const rows = document.getElementById('cameraSettingsRows');
        const availableDevices = document.getElementById('availableCameraDevices');
        const sourceSelect = document.getElementById('cameraCaptureSource');
        const message = document.getElementById('cameraSettingsMessage');
        const saveButton = document.getElementById('saveCameraSettings');
        const rescanButton = document.getElementById('rescanCameraDevices');
        let draftCameras = [];
        let renderedSource = 'browser';
        let browserDeviceIndices = readBrowserDeviceIndices();

        document.querySelectorAll('[data-camera-settings-copy]').forEach(element => {
            element.textContent = text(element.dataset.cameraSettingsCopy);
        });
        document.querySelectorAll('[data-camera-settings-aria]').forEach(element => {
            element.setAttribute('aria-label', text(element.dataset.cameraSettingsAria));
        });
        document.querySelectorAll('[data-camera-settings-open]').forEach(button => {
            button.setAttribute('aria-label', text('title'));
            button.title = text('title');
            button.addEventListener('click', async () => {
                dialog.showModal();
                message.textContent = '';
                try {
                    const response = await fetch('/api/camera-settings');
                    const result = await response.json();
                    if (!response.ok) throw new Error(result.error || 'Request failed.');
                    await renderAvailableDevices();
                    render({
                        ...result,
                        captureSource: localStorage.getItem('stereoCameraSource') === 'docker' ? 'docker' : 'browser'
                    });
                    message.textContent = text('loaded');
                } catch (error) {
                    message.textContent = text('loadError', { message: error.message });
                    message.dataset.state = 'error';
                }
            });
        });
        document.querySelectorAll('[data-camera-settings-close]').forEach(button => {
            button.addEventListener('click', () => dialog.close());
        });
        dialog.addEventListener('click', event => {
            if (event.target === dialog) dialog.close();
        });

        function render(settings) {
            sourceSelect.value = settings.captureSource;
            renderedSource = settings.captureSource;
            draftCameras = settings.cameras.map(camera => ({ ...camera }));
            if (browserDeviceIndices.length !== draftCameras.length) {
                browserDeviceIndices = readBrowserDeviceIndices(draftCameras.length);
            }
            rows.replaceChildren();
            settings.cameras.forEach((camera, cameraIndex) => {
                const row = document.createElement('tr');
                const slot = document.createElement('th');
                slot.scope = 'row';
                slot.textContent = text('camera', { slot: camera.slot });

                const deviceCell = document.createElement('td');
                const device = document.createElement('select');
                device.name = 'deviceIndex';
                device.setAttribute('aria-label', `${text('device')} ${camera.slot}`);
                const selectedIndex = settings.captureSource === 'browser'
                    ? browserDeviceIndices[cameraIndex]
                    : camera.deviceIndex;
                for (let index = 0; index <= 31; index += 1) {
                    const key = settings.captureSource === 'browser' ? 'browserOption' : 'dockerOption';
                    const option = new Option(text(key, { index }), String(index));
                    option.selected = selectedIndex === index;
                    device.add(option);
                }
                deviceCell.append(device);

                const labelCell = document.createElement('td');
                const label = document.createElement('input');
                label.name = 'label';
                label.type = 'text';
                label.maxLength = 40;
                label.required = true;
                label.value = camera.label;
                label.setAttribute('aria-label', `${text('label')} ${camera.slot}`);
                labelCell.append(label);

                const activeCell = document.createElement('td');
                activeCell.className = 'camera-settings-active';
                const active = document.createElement('input');
                active.name = 'active';
                active.type = 'checkbox';
                active.checked = camera.active;
                active.setAttribute('aria-label', `${text('active')} ${camera.slot}`);
                activeCell.append(active);

                const removeCell = document.createElement('td');
                const remove = document.createElement('button');
                remove.type = 'button';
                remove.className = 'camera-settings-remove';
                remove.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>';
                remove.setAttribute('aria-label', text('removeCamera', { slot: camera.slot }));
                remove.title = text('removeCamera', { slot: camera.slot });
                remove.disabled = settings.cameras.length <= 1;
                remove.addEventListener('click', () => removeCamera(cameraIndex));
                removeCell.append(remove);
                row.append(slot, deviceCell, labelCell, activeCell, removeCell);
                rows.append(row);
            });
        }

        async function renderAvailableDevices(devices = null) {
            availableDevices.replaceChildren();
            try {
                if (devices === null) {
                    const response = await fetch('/api/cameras/available');
                    const result = await response.json();
                    if (!response.ok) throw new Error(result.error || 'Request failed.');
                    devices = result.devices;
                }
                const available = Array.isArray(devices) ? devices : [];
                if (!available.length) {
                    const item = document.createElement('li');
                    item.textContent = text('noAvailableDevices');
                    availableDevices.append(item);
                    return;
                }
                available.forEach(device => {
                    const item = document.createElement('li');
                    item.textContent = device.path;
                    availableDevices.append(item);
                });
            } catch (error) {
                console.error('Could not load available Docker/Linux camera devices.', error);
                const item = document.createElement('li');
                item.textContent = text('availableDevicesError');
                availableDevices.append(item);
            }
        }

        function readCameras() {
            return [...rows.querySelectorAll('tr')].map((row, index) => ({
                slot: index + 1,
                deviceIndex: Number(row.querySelector('[name="deviceIndex"]').value),
                label: row.querySelector('[name="label"]').value,
                active: row.querySelector('[name="active"]').checked
            }));
        }

        function readBrowserDeviceIndices(count = 4) {
            try {
                const indexes = JSON.parse(localStorage.getItem('stereoBrowserDeviceIndices') || 'null');
                if (
                    Array.isArray(indexes)
                    && indexes.length === count
                    && indexes.every(index => Number.isInteger(index) && index >= 0 && index <= 31)
                    && new Set(indexes).size === count
                ) {
                    return indexes;
                }
            } catch (error) {
                console.warn('Ignoring invalid browser camera index preferences.', error);
            }
            return Array.from({ length: count }, (_, index) => index);
        }

        function nextFreeIndex(used) {
            for (let index = 0; index <= 31; index += 1) {
                if (!used.has(index)) return index;
            }
            return null;
        }

        function syncDraftFromRows() {
            const visibleCameras = readCameras();
            if (sourceSelect.value === 'browser') {
                browserDeviceIndices = visibleCameras.map(camera => camera.deviceIndex);
                draftCameras = visibleCameras.map((camera, index) => ({
                    ...camera,
                    deviceIndex: draftCameras[index] ? draftCameras[index].deviceIndex : camera.deviceIndex
                }));
            } else {
                draftCameras = visibleCameras;
            }
        }

        function addCamera() {
            syncDraftFromRows();
            message.dataset.state = '';
            if (draftCameras.length >= 16) {
                message.textContent = text('maxCameras');
                message.dataset.state = 'error';
                return;
            }
            const dockerIndex = nextFreeIndex(new Set(draftCameras.map(camera => camera.deviceIndex)));
            const browserIndex = nextFreeIndex(new Set(browserDeviceIndices));
            if (dockerIndex === null || browserIndex === null) {
                message.textContent = text('noIndex');
                message.dataset.state = 'error';
                return;
            }
            const slot = draftCameras.length + 1;
            draftCameras.push({
                slot,
                label: `Camera ${slot}`,
                deviceIndex: dockerIndex,
                active: false
            });
            browserDeviceIndices.push(browserIndex);
            render({ captureSource: sourceSelect.value, cameras: draftCameras });
        }

        function removeCamera(index) {
            syncDraftFromRows();
            if (draftCameras.length <= 1) return;
            draftCameras.splice(index, 1);
            browserDeviceIndices.splice(index, 1);
            draftCameras = draftCameras.map((camera, slotIndex) => ({ ...camera, slot: slotIndex + 1 }));
            render({ captureSource: sourceSelect.value, cameras: draftCameras });
        }

        document.getElementById('addCameraSlot').addEventListener('click', addCamera);
        rescanButton.addEventListener('click', async () => {
            message.textContent = '';
            message.dataset.state = '';
            rescanButton.disabled = true;
            try {
                const response = await fetch('/api/cameras/rescan', { method: 'POST' });
                const result = await response.json();
                if (!response.ok) throw new Error(result.error || 'Request failed.');
                await renderAvailableDevices(result.devices);
                if (!result.assigned) {
                    message.textContent = text('noCameraAssignment');
                    return;
                }
                const settings = {
                    ...result.settings,
                    captureSource: sourceSelect.value
                };
                render(settings);
                message.textContent = text('rescanned');
                document.dispatchEvent(new CustomEvent('camera-settings-saved', { detail: settings }));
            } catch (error) {
                message.textContent = text('rescanError', { message: error.message });
                message.dataset.state = 'error';
            } finally {
                rescanButton.disabled = false;
            }
        });
        sourceSelect.addEventListener('change', () => {
            const visibleCameras = readCameras();
            if (renderedSource === 'docker') {
                draftCameras = visibleCameras;
            } else {
                browserDeviceIndices = visibleCameras.map(camera => camera.deviceIndex);
                draftCameras = visibleCameras.map((camera, index) => ({
                    ...camera,
                    deviceIndex: draftCameras[index].deviceIndex
                }));
            }
            render({ captureSource: sourceSelect.value, cameras: draftCameras });
        });

        form.addEventListener('submit', async event => {
            event.preventDefault();
            message.textContent = '';
            message.dataset.state = '';
            saveButton.disabled = true;
            const visibleCameras = readCameras();
            if (new Set(visibleCameras.map(camera => camera.deviceIndex)).size !== visibleCameras.length) {
                message.textContent = text('duplicateBrowserIndexes');
                message.dataset.state = 'error';
                saveButton.disabled = false;
                return;
            }
            if (sourceSelect.value === 'browser') {
                browserDeviceIndices = visibleCameras.map(camera => camera.deviceIndex);
            }
            const cameras = visibleCameras.map((camera, index) => ({
                ...camera,
                deviceIndex: sourceSelect.value === 'browser'
                    ? draftCameras[index].deviceIndex
                    : camera.deviceIndex
            }));
            try {
                const response = await fetch('/api/camera-settings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cameras })
                });
                const result = await response.json();
                if (!response.ok) throw new Error(result.error || 'Request failed.');
                localStorage.setItem('stereoCameraSource', sourceSelect.value);
                localStorage.setItem('stereoBrowserDeviceIndices', JSON.stringify(browserDeviceIndices));
                const savedSettings = {
                    ...result,
                    captureSource: sourceSelect.value,
                    browserDeviceIndices
                };
                render(savedSettings);
                message.textContent = text('saved');
                document.dispatchEvent(new CustomEvent('camera-settings-saved', { detail: savedSettings }));
            } catch (error) {
                message.textContent = text('saveError', { message: error.message });
                message.dataset.state = 'error';
            } finally {
                saveButton.disabled = false;
            }
        });
    })();
</script>
